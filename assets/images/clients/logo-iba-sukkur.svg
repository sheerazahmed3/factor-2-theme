    <path d="M26 6L9 12v17c0 12 7.5 19 17 21.5 9.5-2.5 17-9.5 17-21.5V12L26 6z" fill="#ffffff" opacity="0.15"/>
    <path d="M26 8L11 13.5v15c0 10.5 6.5 17 15 19 8.5-2 15-8.5 15-19v-15L26 8z" fill="#0b5e36"/>
