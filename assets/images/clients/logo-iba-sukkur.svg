  <text x="64" y="42" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#0b5e36" letter-spacing="2px">UNIVERSITY</text>
  <text x="64" y="55" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#64748b" letter-spacing="0.5px">Merit · Quality · Excellence</text>
